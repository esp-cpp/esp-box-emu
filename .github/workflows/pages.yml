name: Web console (GitHub Pages)

# The Emulator Console (web/): the page the firmware advertises as its WebUSB
# landing page (esp-cpp.github.io/<repo>/). Needs Settings -> Pages -> Source:
# GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts parse
        run: for f in web/*.js; do node --check "$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
